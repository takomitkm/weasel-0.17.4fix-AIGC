name: IPC regression tests (temporary CI probe)

on:
  push:
  workflow_dispatch:

jobs:
  ipc-tests:
    runs-on: windows-2022
    env:
      boost_version: 1.84.0
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_84_0
      SDKVER: 10.0.19041.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Configure build environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item env.vs2022.bat env.bat
          $env:PLATFORM_TOOLSET = 'v143'
          $env:VERSION_MAJOR = '0'
          $env:VERSION_MINOR = '17'
          $env:VERSION_PATCH = '4'
          $env:PRODUCT_VERSION = '0.17.4.999'
          $env:FILE_VERSION = '0.17.4.999'
          cscript.exe //nologo render.js weasel.props BOOST_ROOT PLATFORM_TOOLSET VERSION_MAJOR VERSION_MINOR VERSION_PATCH PRODUCT_VERSION FILE_VERSION
          if ($LASTEXITCODE -ne 0) { throw "render.js failed with exit code $LASTEXITCODE" }

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: ${{ env.BOOST_ROOT }}
          key: ${{ runner.os }}-boost-${{ env.boost_version }}-ipc-probe

      - name: Install and build Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\install_boost.bat
          if ($LASTEXITCODE -ne 0) { throw "install_boost.bat failed with exit code $LASTEXITCODE" }
          .\build.bat boost arm64
          if ($LASTEXITCODE -ne 0) { throw "build.bat boost arm64 failed with exit code $LASTEXITCODE" }

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          sdk: ${{ env.SDKVER }}

      - name: Build IPC regression tests (Debug x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $solutionDir = (Resolve-Path .).Path + '\'
          msbuild.exe test\TestResponseParser\TestResponseParser.vcxproj /p:Configuration=Debug /p:Platform=x64 /p:SolutionDir=$solutionDir /p:WindowsTargetPlatformVersion=${{ env.SDKVER }} /fl7
          if ($LASTEXITCODE -ne 0) { throw "TestResponseParser build failed with exit code $LASTEXITCODE" }

      - name: Run handshake tests (must pass)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Path . -Recurse -Filter TestResponseParser.exe |
            Where-Object { $_.FullName -like '*\msbuild\Debug\x64\*' } |
            Select-Object -First 1
          if (-not $exe) { throw 'TestResponseParser.exe not found under msbuild\Debug\x64' }
          Write-Host "Running $($exe.FullName) /handshake"
          # Feed an empty line to the trailing system("pause") and capture the
          # child's stdout+stderr natively: a cmd `>` redirect lost the output.
          $out = '' | & $exe.FullName /handshake 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host '--- handshake test output ---'
          Write-Host $out
          $out | Out-File -FilePath 'ipc-handshake-output.log' -Encoding utf8
          Write-Host "--- exit code: $code ---"
          if ($code -ne 0) { throw "handshake tests failed with exit code $code" }

      - name: Run full suite (informational)
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path . -Recurse -Filter TestResponseParser.exe |
            Where-Object { $_.FullName -like '*\msbuild\Debug\x64\*' } |
            Select-Object -First 1
          Write-Host "Running full suite: $($exe.FullName)"
          Write-Host 'NOTE: test_4 on this base still encodes the retired per-field'
          Write-Host 'ctx.cand protocol, so BOOST_ASSERT aborts the process (exit 3).'
          Write-Host '#1983 rewrites test_4; that failure predates this patch.'
          $out = '' | & $exe.FullName 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host '--- full suite output ---'
          Write-Host $out
          $out | Out-File -FilePath 'ipc-fullsuite-output.log' -Encoding utf8
          Write-Host "--- full suite exit code: $code (3 = pre-existing test_4 abort) ---"

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipc-regression-msbuild-log
          path: |
            msbuild*.log
            ipc-handshake-output.log
            ipc-fullsuite-output.log
          if-no-files-found: ignore
